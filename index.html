<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Members Portal</title>
<style>
:root{--navy:#0B1D3A;--gold:#D4AF37;--light:#F5F7FA;--green:#2ECC71;--red:#E74C3C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial}
body{height:100vh;overflow:hidden;background:var(--light)}
.screen{display:none;width:100%;height:100vh}
.screen.active{display:flex;flex-direction:column}

/* Login/Signup */
#loginScreen{justify-content:center;align-items:center;background:linear-gradient(135deg,var(--navy),#1a365d);padding:20px}
.login-box{background:white;color:#333;padding:35px 25px;border-radius:16px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
.login-box h2{color:var(--navy);margin-bottom:8px;font-size:28px}
.login-box p{margin-bottom:20px;color:#666;font-size:14px}
.login-box input{width:100%;padding:14px;margin:8px 0;border:2px solid #ddd;border-radius:8px;font-size:16px}
.login-box button{width:100%;padding:15px;background:var(--navy);color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:12px}
.login-box button:active{transform:scale(0.98)}
.error{color:var(--red);font-size:13px;margin-top:8px;display:none;text-align:left}
.toggle-link{margin-top:15px;font-size:14px;color:#666}
.toggle-link span{color:var(--navy);font-weight:bold;cursor:pointer;text-decoration:underline}

/* Dashboard */
#dashboardScreen{background:var(--light)}
.header{background:var(--navy);color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}
.header h2{color:var(--gold);font-size:20px}
.logout-btn{background:var(--red);border:none;color:white;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:14px}
.logout-btn:active{opacity:0.8}

.content{flex:1;overflow-y:auto;padding:20px}
.welcome-card{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.welcome-card h3{color:var(--navy);margin-bottom:8px}
.welcome-card p{color:#666;font-size:14px}

.members-section{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.members-section h3{color:var(--navy);margin-bottom:15px;font-size:18px}
.member-card{padding:15px;background:#f8f9fa;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid var(--gold)}
.member-info{flex:1}
.member-email{font-weight:bold;color:#333;font-size:15px}
.member-status{font-size:12px;color:var(--green);margin-top:3px}
.call-btn{background:var(--green);border:none;color:white;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold}
.call-btn:active{opacity:0.8}

/* Call Modal */
#callModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:999}
#callModal.active{display:flex}
.call-box{background:var(--navy);color:white;padding:40px 30px;border-radius:20px;text-align:center;min-width:300px}
.call-box h2{color:var(--gold);margin-bottom:15px;font-size:24px}
.call-box p{font-size:16px;margin-bottom:25px;opacity:0.8}
.call-btns{margin-top:25px;display:flex;gap:20px;justify-content:center}
.call-btns button{width:70px;height:70px;border-radius:50%;border:none;font-size:28px;cursor:pointer}
.call-btns button:active{transform:scale(0.9)}
.btn-accept{background:var(--green)}
.btn-reject{background:var(--red)}
</style>
</head>
<body>

<!-- LOGIN / SIGNUP SCREEN -->
<div id="loginScreen" class="screen active">
  <div class="login-box">
    <h2>Members Portal</h2>
    <p id="formTitle">Sign In to your account</p>
    <input type="email" id="email" placeholder="Enter email">
    <input type="password" id="password" placeholder="Password - min 6 chars">
    <button onclick="handleAuth()" id="authBtn">Login</button>
    <div class="error" id="errorMsg"></div>
    <div class="toggle-link">
      <span id="toggleText" onclick="toggleMode()">Create new account</span>
    </div>
  </div>
</div>

<!-- DASHBOARD SCREEN -->
<div id="dashboardScreen" class="screen">
  <div class="header">
    <h2>Members Portal</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
  
  <div class="content">
    <div class="welcome-card">
      <h3>Welcome, <span id="userEmail"></span></h3>
      <p>You are logged in. Click Call to start voice chat with any member.</p>
    </div>

    <div class="members-section">
      <h3>All Members</h3>
      <div id="membersList">Loading members...</div>
    </div>
  </div>
</div>

<!-- CALL MODAL -->
<div id="callModal">
  <div class="call-box">
    <h2 id="callStatus">Calling...</h2>
    <p id="callUser"></p>
    <div class="call-btns">
      <button class="btn-accept" id="acceptBtn" onclick="acceptCall()" style="display:none">✓</button>
      <button class="btn-reject" onclick="endCall()">✕</button>
    </div>
  </div>
</div>

<!-- FIREBASE + AGORA CDN -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

<script>
// ===== YOUR KEYS FILLED =====
const firebaseConfig = {
  apiKey: "AIzaSyCY75Whxe2i9ITdxWctl-LwmCxPugv9pk0",
  authDomain: "chatcall-app-99bde.firebaseapp.com",
  databaseURL: "https://chatcall-app-99bde-default-rtdb.firebaseio.com",
  projectId: "chatcall-app-99bde",
  storageBucket: "chatcall-app-99bde.firebasestorage.app",
  messagingSenderId: "565789395277",
  appId: "1:565789395277:web:02c9fb0bb869873b208f04"
};
const AGORA_APP_ID = '90d7e54be9104767a344ad2b344e0a0d';
// =============================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let isLoginMode = true;
let agoraClient = null;
let localAudioTrack = null;

function showError(msg){
  const errorDiv = document.getElementById('errorMsg');
  errorDiv.textContent = msg;
  errorDiv.style.display = 'block';
}

function toggleMode(){
  isLoginMode = !isLoginMode;
  document.getElementById('formTitle').textContent = isLoginMode ? 'Sign In to your account' : 'Create new account';
  document.getElementById('authBtn').textContent = isLoginMode ? 'Login' : 'Sign Up';
  document.getElementById('toggleText').textContent = isLoginMode ? 'Create new account' : 'Already have account? Login';
  showError('');
}

// LOGIN / SIGNUP
function handleAuth(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  showError('');

  if(!email ||!password){
    showError('Enter email and password');
    return;
  }
  if(password.length < 6){
    showError('Password min 6 chars');
    return;
  }

  if(isLoginMode){
    auth.signInWithEmailAndPassword(email, password)
    .then(cred => loginSuccess(cred.user))
    .catch(err => showError(err.message));
  } else {
    auth.createUserWithEmailAndPassword(email, password)
    .then(cred => loginSuccess(cred.user))
    .catch(err => showError(err.message));
  }
}

function loginSuccess(user){
  currentUser = user;
  db.ref('users/' + user.uid).set({
    email: user.email,
    online: true,
    lastSeen: Date.now()
  });

  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('dashboardScreen').classList.add('active');
  document.getElementById('userEmail').textContent = user.email;
  loadMembers();
  listenForIncomingCalls();
}

function logout(){
  if(currentUser){
    db.ref('users/' + currentUser.uid).update({online: false});
  }
  auth.signOut();
  location.reload();
}

// LOAD MEMBERS
function loadMembers(){
  db.ref('users').on('value', snap => {
    const list = document.getElementById('membersList');
    list.innerHTML = '';
    snap.forEach(child => {
      if(child.key !== currentUser.uid){
        const data = child.val();
        const div = document.createElement('div');
        div.className = 'member-card';
        div.innerHTML = `
          <div class="member-info">
            <div class="member-email">${data.email}</div>
            <div class="member-status">${data.online ? '🟢 Online' : '⚫ Offline'}</div>
          </div>
          <button class="call-btn" onclick="startCall('${child.key}', '${data.email}')">📞 Call</button>
        `;
        list.appendChild(div);
      }
    });
    if(list.innerHTML === '') list.innerHTML = '<p style="opacity:0.6">No other members yet. Share link for others to join.</p>';
  });
}

// VOICE CALL
async function startCall(uid, email){
  const callId = [currentUser.uid, uid].sort().join('_');
  document.getElementById('callModal').classList.add('active');
  document.getElementById('callStatus').textContent = 'Calling...';
  document.getElementById('callUser').textContent = email;
  document.getElementById('acceptBtn').style.display = 'none';

  await db.ref('calls/' + callId).set({
    from: currentUser.uid,
    to: uid,
    status: 'calling',
    time: Date.now()
  });

  initAgora(callId);
  listenForCallAnswer(callId);
}

async function initAgora(channelName){
  try{
    agoraClient = AgoraRTC.createClient({mode: 'rtc', codec: 'vp8'});
    await agoraClient.join(AGORA_APP_ID, channelName, null, currentUser.uid);
    localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
    await agoraClient.publish(localAudioTrack);

    agoraClient.on('user-published', async (user, mediaType) => {
      await agoraClient.subscribe(user, mediaType);
      if(mediaType === 'audio') user.audioTrack.play();
    });
  }catch(e){
    alert('Call error: ' + e.message);
    endCall();
  }
}

function listenForCallAnswer(callId){
  db.ref('calls/' + callId).on('value', snap => {
    if(!snap.exists()) return;
    const data = snap.val();
    if(data.status === 'accepted'){
      document.getElementById('callStatus').textContent = 'Connected ✓';
      document.getElementById('acceptBtn').style.display = 'none';
    }
    if(data.status === 'ended') endCall();
  });
}

function listenForIncomingCalls(){
  db.ref('calls').orderByChild('to').equalTo(currentUser.uid).on('child_added', snap => {
    const data = snap.val();
    if(data.status === 'calling'){
      window.currentCallId = snap.key;
      document.getElementById('callModal').classList.add('active');
      document.getElementById('callStatus').textContent = 'Incoming Call';
      document.getElementById('callUser').textContent = 'Member is calling...';
      document.getElementById('acceptBtn').style.display = 'inline-block';
    }
  });
}

async function acceptCall(){
  await db.ref('calls/' + window.currentCallId).update({status: 'accepted'});
  initAgora(window.currentCallId);
}

function endCall(){
  document.getElementById('callModal').classList.remove('active');
  if(agoraClient) agoraClient.leave();
  if(localAudioTrack) localAudioTrack.close();
  if(window.currentCallId){
    db.ref('calls/' + window.currentCallId).update({status: 'ended'});
  }
}

auth.onAuthStateChanged(user => {
  if(user && !currentUser){
    loginSuccess(user);
  }
});
</script>
</body>
</html>
