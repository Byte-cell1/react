<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chat & Call App</title>
<style>
:root{--navy:#0B1D3A;--gold:#D4AF37;--light:#F5F7FA;--green:#2ECC71;--red:#E74C3C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial}
body{height:100vh;overflow:hidden;background:var(--light)}
.screen{display:none;width:100%;height:100vh}
.screen.active{display:flex;flex-direction:column}

/* Login */
#loginScreen{justify-content:center;align-items:center;background:linear-gradient(135deg,var(--navy),#1a365d);padding:20px}
.login-box{background:white;color:#333;padding:35px 25px;border-radius:16px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
.login-box h2{color:var(--navy);margin-bottom:8px;font-size:26px}
.login-box p{margin-bottom:20px;color:#666;font-size:14px}
.login-box input{width:100%;padding:14px;margin:8px 0;border:2px solid #ddd;border-radius:8px;font-size:16px}
.login-box button{width:100%;padding:15px;background:var(--navy);color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:12px}
.login-box button:active{transform:scale(0.98)}
.error{color:var(--red);font-size:13px;margin-top:8px;display:none;text-align:left}

/* Main App */
#appScreen{flex-direction:row}
.sidebar{width:280px;background:var(--navy);color:white;padding:15px;overflow-y:auto;transition:transform 0.3s}
.sidebar h3{margin-bottom:15px;color:var(--gold);font-size:16px}
.user-card{padding:14px;background:rgba(255,255,255,0.1);border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:15px}
.user-card:active{background:rgba(255,255,255,0.2)}
.user-card.active{background:var(--gold);color:var(--navy);font-weight:bold}

.chat-area{flex:1;display:flex;flex-direction:column;background:white}
.chat-header{padding:16px;border-bottom:1px solid #ddd;background:var(--navy);color:white;display:flex;justify-content:space-between;align-items:center}
.chat-header span{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;flex:1;margin-left:10px}
.call-btn{background:var(--green);border:none;color:white;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:15px}
.call-btn:active{opacity:0.8}

.messages{flex:1;overflow-y:auto;padding:15px;background:#fafafa;-webkit-overflow-scrolling:touch}
.msg{max-width:75%;margin-bottom:10px;padding:12px 15px;border-radius:12px;font-size:15px;line-height:1.4;word-wrap:break-word}
.msg.me{background:var(--navy);color:white;margin-left:auto;border-bottom-right-radius:4px}
.msg.other{background:#e9e9e9;margin-right:auto;border-bottom-left-radius:4px}

.input-area{padding:12px;border-top:1px solid #ddd;display:flex;gap:8px;background:white}
.input-area input{flex:1;padding:14px;border:2px solid #ddd;border-radius:25px;font-size:15px;outline:none}
.input-area button{padding:0 20px;background:var(--navy);color:white;border:none;border-radius:25px;cursor:pointer;font-weight:bold;font-size:15px}
.input-area button:active{transform:scale(0.95)}

.no-chat{display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:16px}

/* Call Modal */
#callModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:999}
#callModal.active{display:flex}
.call-box{background:var(--navy);color:white;padding:40px 30px;border-radius:20px;text-align:center;min-width:300px}
.call-box h2{color:var(--gold);margin-bottom:15px;font-size:24px}
.call-box p{font-size:16px;margin-bottom:25px;opacity:0.8}
.call-btns{margin-top:25px;display:flex;gap:20px;justify-content:center}
.call-btns button{width:70px;height:70px;border-radius:50%;border:none;font-size:28px;cursor:pointer}
.call-btns button:active{transform:scale(0.9)}
.btn-accept{background:var(--green)}
.btn-reject{background:var(--red)}

.menu-btn{display:none;background:none;border:none;color:white;font-size:24px;padding:0}

/* Mobile */
@media(max-width:768px){
.sidebar{position:absolute;left:0;top:0;height:100%;z-index:20;transform:translateX(-100%)}
.sidebar.active{transform:translateX(0)}
.menu-btn{display:block}
.msg{max-width:85%}
.login-box{padding:30px 20px}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="screen active">
  <div class="login-box">
    <h2>Chat & Call</h2>
    <p>Use 2 different emails to test chat + voice calls</p>
    <input type="email" id="email" placeholder="Enter email" autocomplete="email">
    <input type="password" id="password" placeholder="Password - min 6 chars" autocomplete="current-password">
    <button onclick="handleAuth()">Sign In / Sign Up</button>
    <div class="error" id="errorMsg"></div>
    <p style="font-size:12px;margin-top:15px;color:#999">Tip: Open in Chrome + Incognito for 2nd user</p>
  </div>
</div>

<!-- APP SCREEN -->
<div id="appScreen" class="screen">
  <div class="sidebar" id="sidebar">
    <h3>Online Users</h3>
    <div id="userList">Loading users...</div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <span id="chatWith">Select a user</span>
      <button class="call-btn" id="callBtn" onclick="startCall()" style="display:none">📞 Call</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Send</button>
    </div>
  </div>
</div>

<!-- CALL MODAL -->
<div id="callModal">
  <div class="call-box">
    <h2 id="callStatus">Calling...</h2>
    <p id="callUser"></p>
    <div class="call-btns">
      <button class="btn-accept" id="acceptBtn" onclick="acceptCall()" style="display:none">✓</button>
      <button class="btn-reject" onclick="endCall()">✕</button>
    </div>
  </div>
</div>

<!-- FIREBASE + AGORA CDN -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

<script>
// ===== CONFIG - YOUR FIREBASE KEYS ARE HERE =====
const firebaseConfig = {
  apiKey: "AIzaSyCY75Whxe2i9ITdxWctl-LwmCxPugv9pk0",
  authDomain: "chatcall-app-99bde.firebaseapp.com",
  databaseURL: "https://chatcall-app-99bde-default-rtdb.firebaseio.com",
  projectId: "chatcall-app-99bde",
  storageBucket: "chatcall-app-99bde.firebasestorage.app",
  messagingSenderId: "565789395277",
  appId: "1:565789395277:web:02c9fb0bb869873b208f04"
};
const AGORA_APP_ID = 'PASTE_YOUR_AGORA_APP_ID_HERE';
// =================================================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let selectedUser = null;
let selectedEmail = null;
let agoraClient = null;
let localAudioTrack = null;

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('active');
}

function showError(msg){
  const errorDiv = document.getElementById('errorMsg');
  errorDiv.textContent = msg;
  errorDiv.style.display = 'block';
}

// SIGN IN / SIGN UP
function handleAuth(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  showError('');

  if(!email ||!password){
    showError('Please enter email and password');
    return;
  }
  if(password.length < 6){
    showError('Password must be at least 6 chars');
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
 .then(cred => loginSuccess(cred.user))
 .catch(err => {
      if(err.code === 'auth/user-not-found'){
        auth.createUserWithEmailAndPassword(email, password)
       .then(cred => loginSuccess(cred.user))
       .catch(e => showError(e.message));
      } else if(err.code === 'auth/wrong-password'){
        showError('Wrong password');
      } else {
        showError(err.message);
      }
    });
}

function loginSuccess(user){
  currentUser = user;
  db.ref('users/' + user.uid).set({
    email: user.email,
    online: true,
    lastSeen: Date.now()
  });

  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('appScreen').classList.add('active');
  loadUsers();
  listenForIncomingCalls();
}

// LOAD USERS
function loadUsers(){
  db.ref('users').on('value', snap => {
    const list = document.getElementById('userList');
    list.innerHTML = '';
    snap.forEach(child => {
      if(child.key!== currentUser.uid){
        const data = child.val();
        const div = document.createElement('div');
        div.className = 'user-card';
        div.textContent = data.email.split('@')[0];
        div.onclick = () => selectUser(child.key, data.email, div);
        list.appendChild(div);
      }
    });
    if(list.innerHTML === '') list.innerHTML = '<p style="opacity:0.6;font-size:13px">No other users yet. Open in 2nd browser.</p>';
  });
}

function selectUser(uid, email, element){
  selectedUser = uid;
  selectedEmail = email;
  document.getElementById('chatWith').textContent = email;
  document.getElementById('callBtn').style.display = 'block';
  document.querySelectorAll('.user-card').forEach(c => c.classList.remove('active'));
  element.classList.add('active');
  if(window.innerWidth < 768) toggleSidebar();
  loadMessages();
}

// SEND MESSAGE
function sendMsg(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text ||!selectedUser) return;

  const chatId = [currentUser.uid, selectedUser].sort().join('_');
  db.ref('chats/' + chatId).push({
    from: currentUser.uid,
    text: text,
    time: Date.now()
  });
  input.value = '';
}

// LOAD MESSAGES
function loadMessages(){
  const chatId = [currentUser.uid, selectedUser].sort().join('_');
  db.ref('chats/' + chatId).on('value', snap => {
    const box = document.getElementById('messages');
    box.innerHTML = '';
    snap.forEach(child => {
      const m = child.val();
      const div = document.createElement('div');
      div.className = 'msg ' + (m.from === currentUser.uid? 'me' : 'other');
      div.textContent = m.text;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });
}

// ===== VOICE CALL =====
async function startCall(){
  if(!selectedUser) return;

  const callId = [currentUser.uid, selectedUser].sort().join('_');
  document.getElementById('callModal').classList.add('active');
  document.getElementById('callStatus').textContent = 'Calling...';
  document.getElementById('callUser').textContent = selectedEmail;
  document.getElementById('acceptBtn').style.display = 'none';

  await db.ref('calls/' + callId).set({
    from: currentUser.uid,
    to: selectedUser,
    status: 'calling',
    time: Date.now()
  });

  initAgora(callId);
  listenForCallAnswer(callId);
}

function listenForCallAnswer(callId){
  db.ref('calls/' + callId).on('value', snap => {
    if(!snap.exists()) return;
    const data = snap.val();
    if(data.status === 'accepted'){
      document.getElementById('callStatus').textContent = 'Connected';
      document.getElementById('acceptBtn').style.display = 'none';
    }
    if(data.status === 'ended'){
      endCall();
    }
  });
}

async function initAgora(channelName){
  agoraClient = AgoraRTC.createClient({mode: 'rtc', codec: 'vp8'});
  await agoraClient.join(AGORA_APP_ID, channelName, null, currentUser.uid);

  localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
  await agoraClient.publish(localAudioTrack);

  agoraClient.on('user-published', async (user, mediaType) => {
    await agoraClient.subscribe(user, mediaType);
    if(mediaType === 'audio'){
      user.audioTrack.play();
    }
  });
}

// INCOMING CALL
function listenForIncomingCalls(){
  db.ref('calls').orderByChild('to').equalTo(currentUser.uid).on('child_added', snap => {
    const data = snap.val();
    if(data.status === 'calling'){
      window.currentCallId = snap.key;
      document.getElementById('callModal').classList.add('active');
      document.getElementById('callStatus').textContent = 'Incoming Call';
      document.getElementById('callUser').textContent = 'User is calling...';
      document.getElementById('acceptBtn').style.display = 'inline-block';
    }
  });
}

async function acceptCall(){
  await db.ref('calls/' + window.currentCallId).update({status: 'accepted'});
  initAgora(window.currentCallId);
}

function endCall(){
  document.getElementById('callModal').classList.remove('active');
  if(agoraClient) agoraClient.leave();
  if(localAudioTrack) localAudioTrack.close();
  if(window.currentCallId){
    db.ref('calls/' + window.currentCallId).update({status: 'ended'});
  }
}

auth.onAuthStateChanged(user => {
  if(user &&!currentUser){
    loginSuccess(user);
  }
});
</script>
</body>
</html>
