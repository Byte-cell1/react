<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chat & Call - React in HTML</title>

<!-- React + Babel CDN - so you can use JSX in 1 file -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Firebase + Agora CDN -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

<style>
:root{--navy:#0B1D3A;--gold:#D4AF37;--light:#F5F7FA;--green:#2ECC71;--red:#E74C3C}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial}
body{height:100vh;overflow:hidden;background:var(--light)}
.login-screen{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),#1a365d);padding:20px}
.login-box{background:white;padding:35px 25px;border-radius:16px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
.login-box h2{color:var(--navy);margin-bottom:8px;font-size:26px}
.login-box input{width:100%;padding:14px;margin:8px 0;border:2px solid #ddd;border-radius:8px;font-size:16px}
.login-box button{width:100%;padding:15px;background:var(--navy);color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin-top:12px;cursor:pointer}
.error{color:var(--red);font-size:13px;margin-top:8px;text-align:left;display:none}
.app-container{display:flex;height:100vh}
.sidebar{width:280px;background:var(--navy);color:white;padding:15px;overflow-y:auto}
.sidebar h3{margin-bottom:15px;color:var(--gold)}
.user-card{padding:14px;background:rgba(255,255,255,0.1);border-radius:8px;margin-bottom:8px;cursor:pointer}
.user-card.active{background:var(--gold);color:var(--navy);font-weight:bold}
.chat-area{flex:1;display:flex;flex-direction:column;background:white}
.chat-header{padding:16px;background:var(--navy);color:white;display:flex;justify-content:space-between;align-items:center}
.call-btn{background:var(--green);border:none;color:white;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:15px;background:#fafafa}
.msg{max-width:75%;margin-bottom:10px;padding:12px 15px;border-radius:12px;font-size:15px}
.msg.me{background:var(--navy);color:white;margin-left:auto;border-bottom-right-radius:4px}
.msg.other{background:#e9e9e9;margin-right:auto;border-bottom-left-radius:4px}
.input-area{padding:12px;border-top:1px solid #ddd;display:flex;gap:8px;background:white}
.input-area input{flex:1;padding:14px;border:2px solid #ddd;border-radius:25px;font-size:15px;outline:none}
.input-area button{padding:0 20px;background:var(--navy);color:white;border:none;border-radius:25px;cursor:pointer;font-weight:bold}
.call-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center}
.call-modal.active{display:flex}
.call-box{background:var(--navy);color:white;padding:40px 30px;border-radius:20px;text-align:center;min-width:300px}
.call-box h2{color:var(--gold);margin-bottom:15px}
.call-btns{margin-top:25px;display:flex;gap:20px;justify-content:center}
.call-btns button{width:70px;height:70px;border-radius:50%;border:none;font-size:28px;cursor:pointer}
.btn-accept{background:var(--green)}
.btn-reject{background:var(--red)}
.no-chat{display:flex;align-items:center;justify-content:center;height:100%;color:#999}
@media(max-width:768px){.sidebar{position:absolute;left:0;top:0;height:100%;z-index:20;transform:translateX(-100%);transition:0.3s}.sidebar.active{transform:translateX(0)}.msg{max-width:85%}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
// ===== CONFIG - REPLACE THESE =====
const firebaseConfig = YOUR_FIREBASE_CONFIG;
const AGORA_APP_ID = 'YOUR_AGORA_APP_ID';
// ===================================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const { useState, useEffect, useRef } = React;

function App() {
  const [user, setUser] = useState(null);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');

  useEffect(() => {
    auth.onAuthStateChanged(u => setUser(u));
  }, []);

  const handleAuth = async () => {
    setError('');
    if (!email || password.length < 6) {
      setError('Enter email + password min 6 chars');
      document.getElementById('errorMsg').style.display = 'block';
      return;
    }
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      saveUser(cred.user);
    } catch (e) {
      if (e.code === 'auth/user-not-found') {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        saveUser(cred.user);
      } else {
        setError(e.message);
        document.getElementById('errorMsg').style.display = 'block';
      }
    }
  };

  const saveUser = (u) => {
    db.collection('users').doc(u.uid).set({
      email: u.email,
      online: true,
      lastSeen: Date.now()
    }, { merge: true });
  };

  if (!user) {
    return (
      <div className="login-screen">
        <div className="login-box">
          <h2>Chat & Call</h2>
          <p style={{marginBottom:20,color:'#666',fontSize:14}}>Use 2 emails to test chat + calls</p>
          <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} />
          <input type="password" placeholder="Password min 6 chars" value={password} onChange={e => setPassword(e.target.value)} />
          <div className="error" id="errorMsg">{error}</div>
          <button onClick={handleAuth}>Sign In / Sign Up</button>
          <p style={{fontSize:12,color:'#999',marginTop:15}}>Tip: Open in Chrome + Incognito for 2nd user</p>
        </div>
      </div>
    );
  }

  return <HomeScreen currentUser={user} />;
}

function HomeScreen({ currentUser }) {
  const [users, setUsers] = useState([]);
  const [selectedUser, setSelectedUser] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(true);

  useEffect(() => {
    const unsub = db.collection('users').onSnapshot(snap => {
      const arr = [];
      snap.forEach(doc => {
        if (doc.id!== currentUser.uid) arr.push({ id: doc.id,...doc.data() });
      });
      setUsers(arr);
    });
    return () => unsub();
  }, [currentUser.uid]);

  return (
    <div className="app-container">
      <div className={`sidebar ${sidebarOpen? 'active' : ''}`}>
        <h3>Online Users</h3>
        {users.map(u => (
          <div key={u.id}
               className={`user-card ${selectedUser?.id === u.id? 'active' : ''}`}
               onClick={() => {setSelectedUser(u); if(window.innerWidth < 768) setSidebarOpen(false)}}>
            {u.email.split('@')[0]}
          </div>
        ))}
      </div>
      <div className="chat-area">
        <div className="chat-header">
          {window.innerWidth < 768 && <button style={{background:'none',border:'none',color:'white',fontSize:24}} onClick={() => setSidebarOpen(!sidebarOpen)}>☰</button>}
          <span style={{flex:1,marginLeft:10}}>{selectedUser? selectedUser.email : 'Select a user'}</span>
          {selectedUser && <button className="call-btn" onClick={() => window.startCall(selectedUser.id, selectedUser.email)}>📞 Call</button>}
        </div>
        {selectedUser? <ChatScreen currentUser={currentUser} otherUser={selectedUser} /> :
         <div className="no-chat">Select a user to start chatting</div>}
      </div>
    </div>
  );
}

function ChatScreen({ currentUser, otherUser }) {
  const [messages, setMessages] = useState([]);
  const [msg, setMsg] = useState('');
  const [inCall, setInCall] = useState(false);
  const [callStatus, setCallStatus] = useState('');
  const clientRef = useRef(null);
  const localTrackRef = useRef(null);

  const chatId = [currentUser.uid, otherUser.id].sort().join('_');

  useEffect(() => {
    const unsub = db.collection('chats').doc(chatId).collection('msgs').orderBy('time')
     .onSnapshot(snap => {
        const arr = [];
        snap.forEach(doc => arr.push(doc.data()));
        setMessages(arr);
        setTimeout(() => {
          const box = document.getElementById('messagesBox');
          if(box) box.scrollTop = box.scrollHeight;
        }, 100);
      });
    return () => unsub();
  }, [chatId]);

  // Expose startCall globally so header button can call it
  window.startCall = async (uid, email) => {
    setCallStatus('Calling...');
    setInCall(true);
    await db.collection('calls').doc(chatId).set({
      from: currentUser.uid,
      to: uid,
      status: 'calling',
      time: Date.now()
    });
    initAgora(chatId);
  };

  const sendMsg = async () => {
    if (!msg.trim()) return;
    await db.collection('chats').doc(chatId).collection('msgs').add({
      from: currentUser.uid,
      text: msg,
      time: Date.now()
    });
    setMsg('');
  };

  // Listen for incoming calls
  useEffect(() => {
    const unsub = db.collection('calls').where('to', '==', currentUser.uid).onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if (change.type === 'added' && change.doc.data().status === 'calling') {
          window.currentCallId = change.doc.id;
          setCallStatus('Incoming Call');
          setInCall(true);
          document.getElementById('callModal').classList.add('active');
          document.getElementById('callStatus').textContent = 'Incoming Call';
          document.getElementById('callUser').textContent = otherUser.email;
          document.getElementById('acceptBtn').style.display = 'inline-block';
        }
        if (change.doc.data().status === 'accepted') {
          setCallStatus('Connected');
          document.getElementById('callStatus').textContent = 'Connected';
          document.getElementById('acceptBtn').style.display = 'none';
        }
        if (change.doc.data().status === 'ended') endCall();
      });
    });
    return () => unsub();
  }, [currentUser.uid, otherUser.email]);

  const acceptCall = async () => {
    await db.collection('calls').doc(window.currentCallId).update({status: 'accepted'});
    initAgora(window.currentCallId);
  };

  const initAgora = async (channelName) => {
    const client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
    clientRef.current = client;

    await client.join(AGORA_APP_ID, channelName, null, currentUser.uid);
    const audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
    localTrackRef.current = audioTrack;
    await client.publish(audioTrack);

    client.on('user-published', async (user, mediaType) => {
      await client.subscribe(user, mediaType);
      if (mediaType === 'audio') user.audioTrack.play();
    });
  };

  const endCall = () => {
    setInCall(false);
    setCallStatus('');
    document.getElementById('callModal').classList.remove('active');
    if (clientRef.current) clientRef.current.leave();
    if (localTrackRef.current) localTrackRef.current.close();
    if (window.currentCallId) db.collection('calls').doc(window.currentCallId).update({status: 'ended'});
  };

  return (
    <>
      <div className="messages" id="messagesBox">
        {messages.map((m, i) => (
          <div key={i} className={`msg ${m.from === currentUser.uid? 'me' : 'other'}`}>
            {m.text}
          </div>
        ))}
      </div>

      <div className="input-area">
        <input value={msg} onChange={e => setMsg(e.target.value)}
               placeholder="Type message..." onKeyPress={e => e.key === 'Enter' && sendMsg()} />
        <button onClick={sendMsg}>Send</button>
      </div>

      <div className="call-modal" id="callModal">
        <div className="call-box">
          <h2 id="callStatus">Calling...</h2>
          <p id="callUser">{otherUser.email}</p>
          <div className="call-btns">
            <button className="btn-accept" id="acceptBtn" onClick={acceptCall} style={{display:'none'}}>✓</button>
            <button className="btn-reject" onClick={endCall}>✕</button>
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
